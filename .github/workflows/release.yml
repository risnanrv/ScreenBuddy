name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Restore Dependencies
        run: dotnet restore ScreenBuddy.sln

      - name: Run Tests
        run: dotnet test ScreenBuddy.sln --configuration Release

      - name: Publish Executable
        run: |
          dotnet publish src/ScreenBuddy/ScreenBuddy.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Compile Installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/setup.iss

      - name: Generate SHA-256 Checksums
        shell: powershell
        run: |
          $installer = Get-ChildItem -Path publish/installer/*.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer executable not found in publish/installer/" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          "$hash  $($installer.Name)" | Out-File -FilePath "$($installer.FullName).sha256" -Encoding ascii
          Write-Host "Generated SHA256 checksum for $($installer.Name): $hash"

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            publish/installer/*.exe
            publish/installer/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
